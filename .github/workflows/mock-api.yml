name: Mock API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start mock server
        run: |
          node project/server.js > /tmp/mock-server.log 2>&1 &
          echo $! > /tmp/mock-server.pid

      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:2250/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mock-server.log
          exit 1

      - name: Verify mock endpoints
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');

          async function main() {
            const healthResponse = await fetch('http://127.0.0.1:2250/api/health');
            assert.equal(healthResponse.status, 200);
            assert.deepEqual(await healthResponse.json(), {
              status: 'ok',
              service: 'mock_server_JS',
            });

            const userResponse = await fetch('http://127.0.0.1:2250/api/users/1');
            assert.equal(userResponse.status, 200);
            assert.deepEqual(await userResponse.json(), {
              id: 1,
              name: 'Mock User',
              email: 'mock.user@example.com',
              role: 'demo',
            });
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop mock server
        if: always()
        run: |
          if [ -f /tmp/mock-server.pid ]; then
            kill "$(cat /tmp/mock-server.pid)" || true
          fi
